[project]
name = "brain-search"
version = "0.1.0"
description = "Fast hybrid (BM25 + multilingual dense + rerank) search and SQL over finite.place brain folders"
authors = [
    { name = "seroxdesign", email = "sherifcherfa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[project.scripts]
brain = "brain_search.cli:main"
brain-validate = "brain_search.validate:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"
